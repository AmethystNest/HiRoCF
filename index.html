<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#161a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HiRoCF Top-Down Racer</title>
<style>
  /* Sized so the whole four-pad row always FITS: 2*ctrlW + 2*actW + 2 gaps
     + the side padding has to stay under 100vw, or the last pad runs off
     the right edge (which is exactly what the old clamp()s did -- at 430px
     they asked for 470px of row). vw-driven with a px ceiling keeps that
     true at every width instead of only at the one it was eyeballed on.
     The pads are taller than they are wide: on a phone the thumb has
     vertical room to spare and none horizontally, so height is where the
     extra target area actually comes from. */
  :root{ --ctrlW: min(21vw, 106px); --actW: min(23vw, 118px); --ctrlH: min(31vw, 152px); }
  html,body{margin:0;height:100%;overflow:hidden;background:#161a1e;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #app{position:fixed;inset:0}
  #app canvas{display:block;width:100%;height:100%}

  .hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:700;
    text-shadow:0 2px 5px rgba(0,0,0,.75)}
  .hud .top{position:absolute;top:max(10px,env(safe-area-inset-top));left:14px;right:14px;
    display:flex;justify-content:space-between;align-items:flex-start;font-size:14px}
  /* Clear of the WHOLE nitro block, not just of its top bar. The gauge
     stack below is 46px tall (cells + burst meter + label) starting
     14px above the pads, so anything under +60 here lands on top of it
     -- at +40 the speed readout was sitting directly across the nitro
     cells and neither could be read. */
  .hud .speed{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--ctrlH) + 68px);
    text-align:center;font-size:22px;letter-spacing:.02em}
  .hud .speed small{font-size:11px;opacity:.75;margin-left:4px;font-weight:600}
  .hud .nitroWrap{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + var(--ctrlH) + 14px);
    width:min(54vw,238px)}
  /* A glass gauge housing rather than bare bars floating on the road --
     same top-lit-glass family as the buttons/pads, so the meter reads as
     part of the instrument cluster instead of a stray HUD widget. */
  .hud .nitroCells{display:flex;gap:6px;padding:5px 6px;border-radius:10px;
    background:radial-gradient(120% 160% at 50% -30%, rgba(255,255,255,.10), rgba(255,255,255,.015) 60%),
               rgba(10,13,17,.34);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 5px rgba(0,0,0,.3);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .hud .nitroCell{position:relative;flex:1;height:10px;border-radius:4px;
    background:rgba(255,255,255,.08);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.10);
    overflow:hidden}
  .hud .nitroCell i{display:block;height:100%;transform-origin:left center;transform:scaleX(0);
    background:linear-gradient(90deg,#1f7fc4,#2f9ae8 45%,#7fe6ff)}
  /* A fixed diagonal sheen over the fill -- reads as a glossy, lit bar
     rather than a flat rectangle, the same trick the button glass uses,
     just linear instead of radial since the cell is so thin. */
  .hud .nitroCell i::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%)}
  .hud .nitroCell.full i{background:linear-gradient(90deg,#3fb2ff,#54c8ff 45%,#d3faff)}
  .hud .nitroCell.full{box-shadow:inset 0 1px 2px rgba(0,0,0,.4),inset 0 0 0 1px rgba(150,225,255,.4),
    0 0 10px rgba(120,220,255,.55);animation:nitroFullPulse 1.6s ease-in-out infinite}
  @keyframes nitroFullPulse{
    0%,100%{box-shadow:inset 0 1px 2px rgba(0,0,0,.4),inset 0 0 0 1px rgba(150,225,255,.4),0 0 8px rgba(120,220,255,.4)}
    50%{box-shadow:inset 0 1px 2px rgba(0,0,0,.4),inset 0 0 0 1px rgba(190,240,255,.75),0 0 16px rgba(120,220,255,.85)}
  }
  /* Burst meter: only up while a charge is actually running. Normalised to
     one charge and clamped, so a chained run simply holds full until the
     last charge starts draining. */
  .hud .nitroBurst{position:relative;height:5px;margin-top:5px;border-radius:3px;overflow:hidden;
    background:rgba(255,255,255,.08);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.10);
    opacity:0;transition:opacity .12s ease}
  .hud .nitroWrap.firing .nitroBurst{opacity:1}
  .hud .nitroBurst i{display:block;height:100%;transform-origin:left center;transform:scaleX(0);
    background:linear-gradient(90deg,#d9820f,#ffb23a 45%,#ffe9a8)}
  .hud .nitroBurst i::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 55%)}
  .hud .nitroLabel{font-size:9px;opacity:.72;text-align:center;margin-top:4px;letter-spacing:.16em}
  .hud .nitroWrap.firing .nitroLabel{opacity:1;color:#ffd489;text-shadow:0 0 8px rgba(255,180,60,.7)}
  /* Below the icon row now, not directly under LAP/POS -- see .iconRow. */
  .hud .note{position:absolute;left:14px;top:calc(max(10px,env(safe-area-inset-top)) + 90px);
    font-size:11px;opacity:.5;font-weight:600}

  .controls{position:fixed;left:0;right:0;bottom:0;
    padding:0 9px calc(env(safe-area-inset-bottom) + 12px);
    display:flex;justify-content:space-between;pointer-events:none}
  /* The pads stay out of the way while the grid is being shown -- the
     camera is closed right in on the two cars, and four slabs across the
     bottom third are the one thing in frame that is not the race. They
     rise back in just before the lights go green, staggered so it reads
     as the controls arriving rather than a panel appearing.
     `pointer-events` goes with them, so a pad off screen cannot be hit.
     The press feedback (transform/background/border/shadow) has to stay
     quick, so it keeps its own short durations here while only the rise
     is slow -- one transition list covering both, or the press would ease
     over a third of a second. */
  /* The HUD and every left-stack button go with the pads: during the grid
     shot the camera is closed right in on the two cars, and a lap
     counter, a clock, a speed reading, a nitro gauge and a row of controls
     around them are all answering questions the race has not asked yet
     (or, post-race, questions it has already finished answering). Stage
     pick and sound used to stay up through both -- they no longer do; the
     zoomed-in shot is supposed to be just the cars, full stop, and a
     player who wants either control back has the same beat to wait
     through as for the driving pads. */
  .hud,.iconBtn{transition:opacity .28s ease,transform .36s cubic-bezier(.16,1,.3,1)}
  body.pre-race .hud{opacity:0;transition:none}
  body.pre-race .iconBtn{
    opacity:0;transform:translateX(-130%);transition:none;pointer-events:none}
  body.pre-race .controls{pointer-events:none}
  body.pre-race .controls .side{pointer-events:none}
  /* `transition:none` on the way IN is the point: the pads are simply not
     there, they are never seen going away. Without it the page opens with
     them up, the first frame of the countdown pushes them down, and the
     start reads as the controls leaving and coming back. The body carries
     this class in the markup so the very first painted frame is already
     without them. Only the rise animates, from the rule above. */
  body.pre-race .controls button{
    opacity:0;transform:translateY(150%);
    transition:none;transition-delay:0s}
  /* Same hidden state as pre-race, for the same reason, after the line:
     the camera pulls back in on both cars (see startCameraBlend's
     'finished' branch) and a lap counter/clock/pad row is nothing to
     look at during that shot. Unlike pre-race this one IS seen leaving --
     the retraction is the point, mirroring the rise that brings it all
     back for the next start -- so it rides the transitions above instead
     of suppressing them. */
  body.post-race .hud{opacity:0}
  body.post-race .iconBtn{
    opacity:0;transform:translateX(-130%);pointer-events:none}
  body.post-race .controls{pointer-events:none}
  body.post-race .controls .side{pointer-events:none}
  body.post-race .controls button{opacity:0;transform:translateY(150%)}
  .controls .side{display:flex;gap:9px;pointer-events:auto}
  /* Glass pad rather than a flat translucent square: a top-lit gradient over
     a dark blurred base, a hairline rim, and an inset highlight along the top
     edge. The dark base is what keeps a white glyph readable over bright
     track as well as over asphalt -- the old .14-white fill washed out
     completely against a concrete apron. */
  .controls button{width:var(--ctrlW);height:var(--ctrlH);
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.26);border-radius:24px;
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(255,255,255,.26), rgba(255,255,255,.04) 62%),
      rgba(16,20,25,.44);
    color:#fff;font-size:clamp(22px,5.6vw,30px);font-weight:800;line-height:1;
    box-shadow:0 8px 22px rgba(0,0,0,.38),
               inset 0 1px 0 rgba(255,255,255,.34),
               inset 0 -3px 8px rgba(0,0,0,.28);
    backdrop-filter:blur(10px) saturate(1.25);-webkit-backdrop-filter:blur(10px) saturate(1.25);
    transition:transform .36s cubic-bezier(.16,1,.3,1),opacity .24s ease,
               background .07s ease,border-color .07s ease,box-shadow .07s ease}
  /* left to right as they come up */
  #left{transition-delay:0s}
  #right{transition-delay:.05s}
  #brake{transition-delay:.10s}
  #nitro{transition-delay:.15s}
  /* a press must not ease -- snap the scale, keep the rise smooth */
  .controls button:active,.controls button.pressed{transition-duration:.07s;transition-delay:0s}
  .controls button:active,.controls button.pressed{
    transform:scale(.94);
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(255,255,255,.5), rgba(255,255,255,.14) 62%),
      rgba(40,48,56,.58);
    border-color:rgba(255,255,255,.85);
    box-shadow:0 0 0 5px rgba(255,255,255,.10),0 0 26px rgba(255,255,255,.26),
               inset 0 1px 0 rgba(255,255,255,.5)
  }
  #left,#right{font-size:clamp(26px,6.4vw,34px)}
  #nitro,#brake{width:var(--actW);font-size:clamp(14px,3.6vw,18px);letter-spacing:.06em;font-weight:900;
    flex-direction:column;gap:5px}
  /* NITRO stays dim until a press would actually fire -- stock in hand and,
     mid-burst, inside the chain window. That is the no-wasted-press rule
     from config.js NITRO, shown rather than explained. */
  #nitro{border-color:rgba(120,205,255,.34)}
  #nitro.ready{border-color:rgba(143,222,255,.9);
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(150,225,255,.42), rgba(60,150,220,.16) 62%),
      rgba(12,30,44,.5);
    box-shadow:0 8px 22px rgba(0,0,0,.38),0 0 22px rgba(73,183,255,.42),
               inset 0 1px 0 rgba(200,240,255,.5)}
  #nitro:active,#nitro.pressed{border-color:rgba(190,240,255,1);
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(200,244,255,.62), rgba(80,180,240,.3) 62%),
      rgba(18,52,74,.62);
    box-shadow:0 0 0 5px rgba(73,183,255,.14),0 0 32px rgba(73,183,255,.66),
               inset 0 1px 0 rgba(225,250,255,.6)}
  #nitro .cnt{font-size:1.05em;opacity:.9;letter-spacing:0;font-variant-numeric:tabular-nums}
  #nitro.ready .cnt{opacity:1;text-shadow:0 0 12px rgba(143,222,255,.9)}
  #brake:active,#brake.pressed{border-color:rgba(255,190,190,.95);
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(255,190,190,.5), rgba(210,80,80,.22) 62%),
      rgba(56,20,20,.58);
    box-shadow:0 0 0 5px rgba(255,92,92,.12),0 0 28px rgba(255,92,92,.4),
               inset 0 1px 0 rgba(255,220,220,.5)}
  /* Short viewports (landscape phones): tall pads would eat the road, and
     there is width to spare there, so height comes off the viewport
     instead of the width. */
  @media (max-height:520px){
    :root{ --ctrlW: min(15vw, 116px); --actW: min(17vw, 132px); --ctrlH: min(27vh, 124px); }
    .controls{padding:0 10px calc(env(safe-area-inset-bottom) + 8px)}
  }

  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#9fb0bd;font-size:13px;letter-spacing:.14em;background:#161a1e;z-index:20}
  #loading.hide{display:none}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:15;color:#fff;font-weight:800;text-align:center}
  .overlay[hidden]{display:none}

  /* Fades both ways, rather than the hard [hidden] flip the other
     overlays use: this one is the opening title of the race, and it is
     on screen alone with the two cars, so it is the one overlay whose
     arrival and exit are part of the show. visibility rides the same
     transition, delayed on the way out so it only cuts once the fade
     has finished. */
  /* --- display type -------------------------------------------------
     One treatment shared by every headline word in the game (VS, the
     countdown numerals, WIN/LOSE): heavy, raked over to the left, and
     filled with a brushed-metal gradient instead of a flat colour, with
     a highlight that sweeps across it once as it arrives.

     Filled via background-clip:text, so `color` no longer paints these
     glyphs -- anything that wants to flash one has to animate `filter`
     (see vsSurge) rather than `color`, and the shadow has to be a
     drop-shadow filter rather than a text-shadow, which would draw
     behind the box instead of behind the letters. */
  .chrome{
    font-weight:900;letter-spacing:-.03em;
    background-image:
      linear-gradient(104deg,transparent 39%,rgba(255,255,255,.92) 47%,transparent 55%),
      linear-gradient(176deg,#fff 4%,#eef4fb 26%,#9fb2c6 50%,#fff 63%,#c6d5e6 85%,#8497ab 100%);
    background-size:260% 100%,100% 100%;
    background-position:170% 0,0 0;
    background-repeat:no-repeat;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 0 20px rgba(150,195,245,.3));
  }
  /* the sweep. Held at its start by `backwards` through the delay, so
     the highlight arrives with the word rather than before it. */
  @keyframes chromeSheen{
    from{background-position:-70% 0,0 0}
    to{background-position:170% 0,0 0}
  }
  /* Raked, but only for Latin: skewing CJK (the rival's name) reads as
     a rendering fault rather than as speed.
     The rake has to live on the SAME element as the gradient, never on
     a child of it: background-clip:text does not reach through a
     transformed descendant, and putting the skew on an inner span made
     both VS and the countdown numerals vanish entirely (the fill was
     clipped to text the browser no longer considered part of that
     element's own box). */
  .rake{display:inline-block;transform:skewX(-9deg)}

  #vsOverlay{opacity:0;visibility:hidden;
    transition:opacity .3s ease,visibility 0s linear .3s}
  /* The card waits for the lightning. The strike goes off the moment the
     state flips to 'vs' (see main.js) and peaks inside ~0.1s; the text
     starts arriving at 0.26s and settles through the tail of it, so the
     order reads strike -> title rather than both at once. */
  #vsOverlay.vis{opacity:1;visibility:visible;
    transition:opacity .46s ease .26s,visibility 0s}
  #vsCard{background:rgba(10,13,17,.82);border:1px solid rgba(255,255,255,.14);
    border-radius:20px;padding:26px 34px;backdrop-filter:blur(6px);
    transform:scale(.9);transition:transform .52s cubic-bezier(.16,1,.3,1)}
  #vsOverlay.vis #vsCard{transform:none;transition-delay:.26s}
  /* label, with a hairline under it -- a caption on the name below,
     rather than another line of text competing with it */
  #vsCard .stage{font-size:11px;opacity:.55;letter-spacing:.42em;text-indent:.42em;
    font-weight:800;padding-bottom:9px;margin-bottom:11px;position:relative}
  #vsCard .stage::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:46px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent)}
  #vsCard .rival{font-size:29px;font-weight:900;letter-spacing:.01em;
    background-image:linear-gradient(176deg,#fff 10%,#dde7f2 46%,#9fb2c6 74%,#eaf2fb 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
  /* VS is the card's headline now, not a caption between two lines:
     chrome-filled, raked, and crackling. The flicker drives `filter`
     because the gradient fill owns `color` -- see .chrome. */
  #vsCard .vs{position:relative;font-size:34px;line-height:1;margin:13px 0 2px;
    letter-spacing:.06em;font-weight:900;transform:skewX(-9deg);
    background-image:
      linear-gradient(104deg,transparent 39%,rgba(255,255,255,.95) 47%,transparent 55%),
      linear-gradient(176deg,#fff 4%,#ffd9d4 22%,#ff5a4a 50%,#fff 62%,#ff7a68 84%,#b8241a 100%);
    background-size:260% 100%,100% 100%;background-position:170% 0,0 0;background-repeat:no-repeat;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(255,80,66,.5));
    animation:chromeSheen 1s ease-out .3s backwards,vsSurge 2.2s steps(1,end) 1.1s infinite}
  @keyframes vsSurge{
    0%,17%,19%,20%,49%,51%,52%,100%{
      filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(255,80,66,.5))}
    18%,50%{
      filter:brightness(2.1) saturate(.4) drop-shadow(0 0 10px rgba(255,255,255,.95))
             drop-shadow(0 0 34px rgba(170,235,255,.9))}
  }
  #vsCard .vs::before,#vsCard .vs::after{
    content:'';position:absolute;top:50%;width:18px;height:27px;
    background:linear-gradient(160deg,#fff,#8fe8ff 55%,#3fa8ef);
    clip-path:polygon(58% 0,18% 54%,44% 54%,8% 100%,82% 40%,50% 40%);
    filter:drop-shadow(0 0 5px rgba(140,225,255,.9));
    opacity:0;animation:vsBolt 2.2s steps(1,end) 1.1s infinite}
  #vsCard .vs::before{left:-32px;transform:translateY(-56%)}
  #vsCard .vs::after{right:-32px;transform:translateY(-56%) scaleX(-1);animation-delay:1.13s}
  @keyframes vsBolt{
    0%,17%,19%,20%,49%,51%,52%,100%{opacity:0}
    18%,50%{opacity:1}
  }

  /* --- start ---------------------------------------------------------
     A start-gantry light bar rather than three dots: five lamps fill
     left to right through the countdown, the numeral punches over them
     on every change, and the screen blinks once as they go green. */
  /* lifted off centre so the numeral never lands on top of the grid --
     the cars sit at the middle of the screen and the rig is the same size
     as they are */
  #startSignal{display:flex;flex-direction:column;align-items:center;gap:14px;
    transform:translateY(-16vh)}
  #startSignal .gantry{display:flex;gap:min(3.4vw,18px);padding:min(2.6vw,14px) min(4vw,22px);
    border-radius:999px;background:linear-gradient(180deg,rgba(26,31,37,.96),rgba(9,11,14,.96));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18)}
  #startSignal .lamp{width:min(7vw,34px);height:min(7vw,34px);border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #3a2020, #170c0c 70%);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.10);
    transition:background .09s ease, box-shadow .09s ease}
  #startSignal .lamp.on{
    background:radial-gradient(circle at 38% 32%, #ff9a90, #e3231a 66%);
    box-shadow:0 0 22px rgba(255,59,48,.85),0 0 46px rgba(255,59,48,.45),
               inset 0 0 0 1px rgba(255,255,255,.28)}
  #startSignal .lamp.go{
    background:radial-gradient(circle at 38% 32%, #b6ffc6, #16c93f 66%);
    box-shadow:0 0 26px rgba(61,220,90,.95),0 0 60px rgba(61,220,90,.5),
               inset 0 0 0 1px rgba(255,255,255,.3)}
  /* The numerals get the same chrome as the rest of the headline type
     (see .chrome) -- raked, brushed-metal, with the sheen re-swept per
     numeral by the punch below. GO! swaps the metal for a hot green. */
  #startSignal .count{font-size:min(23vw,122px);line-height:1;font-weight:900;
    letter-spacing:-.045em;font-variant-numeric:tabular-nums}
  /* On the SPAN, not on .count: the span is what carries the rake and
     the punch transform, and the fill has to sit on the transformed
     element itself -- see .rake. */
  #startSignal .count span{
    background-image:
      linear-gradient(104deg,transparent 39%,rgba(255,255,255,.95) 47%,transparent 55%),
      linear-gradient(176deg,#fff 4%,#eef4fb 26%,#9fb2c6 50%,#fff 63%,#c6d5e6 85%,#8497ab 100%);
    background-size:260% 100%,100% 100%;background-position:170% 0,0 0;background-repeat:no-repeat;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 5px 0 rgba(0,0,0,.6)) drop-shadow(0 0 34px rgba(170,210,255,.4))}
  #startSignal .count.go span{
    background-image:
      linear-gradient(104deg,transparent 39%,rgba(255,255,255,.95) 47%,transparent 55%),
      linear-gradient(176deg,#f4fff7 4%,#a7ffbe 26%,#16c93f 52%,#eafff0 65%,#5cf07c 87%,#0c7d27 100%);
    filter:drop-shadow(0 5px 0 rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(92,240,124,.8))}
  /* re-triggered per numeral by removing and re-adding the class. The
     sheen rides the parent (that is where the gradient lives) while the
     punch rides the glyph itself -- and the punch has to carry the rake
     in every keyframe, or animating `transform` would drop the skew
     .rake set and the numeral would stand up straight mid-count. */
  #startSignal .count.punch span{display:inline-block;
    animation:countPunch .42s cubic-bezier(.16,1,.3,1),chromeSheen .62s ease-out}
  @keyframes countPunch{
    0%{transform:skewX(-9deg) scale(2.1);opacity:0;filter:blur(6px)}
    55%{transform:skewX(-9deg) scale(1.14);opacity:1;filter:blur(0)}
    100%{transform:skewX(-9deg) scale(1);opacity:1}
  }
  /* fixed height: the cue empties on GO, and without this the numeral
     jumps up the screen at the exact moment it should be holding still */
  #startSignal .cue:not(:empty){font-size:min(3.2vw,13px);letter-spacing:.56em;
    text-indent:.56em;font-weight:800;padding:7px 20px;border-radius:999px;
    color:#cfe0ee;
    background:linear-gradient(180deg,rgba(14,19,26,.82),rgba(6,9,12,.86));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);
    backdrop-filter:blur(4px)}
  /* reserved even when empty, so clearing the text on GO does not shunt
     the numeral up the screen at the moment it should be holding still */
  #startSignal .cue{min-height:2.1em;display:flex;align-items:center}
  /* one full-screen blink on the green, then a cooler wash that lingers
     a beat behind it -- the tail of the same hit the side lightning
     (render/boltfx.js) strikes across the screen on that frame */
  #signalOverlay.go::after{content:'';position:absolute;inset:0;background:#eaf7ff;
    animation:goFlash .34s ease-out forwards;pointer-events:none}
  @keyframes goFlash{from{opacity:.55}to{opacity:0}}
  #signalOverlay.go::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 70% at 50% 46%,rgba(134,228,255,.42),rgba(134,228,255,0) 70%);
    animation:goWash .55s ease-out forwards}
  @keyframes goWash{from{opacity:1}to{opacity:0}}
  /* the gantry and numeral fade up rather than cutting in */
  #startSignal{animation:signalIn .3s ease-out}
  @keyframes signalIn{from{opacity:0;transform:translateY(-16vh) scale(.94)}
    to{opacity:1;transform:translateY(-16vh) scale(1)}}

  /* --- result --------------------------------------------------------- */
  /* Anchored to the top rather than centred like the other overlays: the
     post-race camera (see finishFraming in main.js) zooms in on the car
     that just crossed the line, and a centred card sat directly over
     the very car that zoom exists to show.
     EVERY vertical metric below is vh-driven for the same reason. The
     card used to be ~310px tall whatever the screen -- fine on a 860px
     viewport, two thirds of an in-app browser with a URL bar, where it
     covered the car again. Sized in vh it keeps to the top
     FINISH_CARD_BAND (0.46) of the screen at any height, which is the
     budget main.js frames the car below. */
  #finishOverlay{align-items:flex-start;padding-top:clamp(12px,5.6vh,54px)}
  #finishCard{position:relative;border-radius:24px;min-width:min(78vw,300px);
    padding:clamp(14px,3.2vh,30px) clamp(18px,3.2vh,30px) clamp(12px,2.8vh,26px);
    background:linear-gradient(180deg,rgba(18,23,29,.96),rgba(7,9,12,.97));
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 26px 70px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.14);
    /* Waits out the lightning. strikeResultBolts() fires on the frame
       this card is unhidden, so the delay is what puts the strike
       first and the result second; `backwards` holds the card at
       opacity 0 through it instead of showing it early. */
    animation:cardIn .54s cubic-bezier(.16,1,.3,1) .26s backwards}
  @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.93)}to{opacity:1;transform:none}}
  /* the accent is the result: gold for a win, steel for anything else */
  #finishCard{--accent:#9aa4ae;--accent2:#5d666f}
  #finishCard.win{--accent:#ffd64a;--accent2:#c9932a}
  #finishCard::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;
    background:linear-gradient(160deg,var(--accent),transparent 42%,transparent 60%,var(--accent2));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;pointer-events:none}
  #finishCard .ribbon{display:inline-block;font-size:9px;letter-spacing:.44em;text-indent:.44em;
    padding:5px 14px;border-radius:999px;color:#05070a;
    background:linear-gradient(180deg,#fff,var(--accent) 60%,var(--accent2));
    box-shadow:0 2px 10px rgba(0,0,0,.4);
    font-weight:900;margin-bottom:clamp(5px,1.4vh,12px)}
  #finishCard h2{margin:0 0 4px;font-size:clamp(10px,1.6vh,12px);letter-spacing:.44em;
    text-indent:.44em;opacity:.5;font-weight:800}
  /* The result word, in the same chrome as VS and the countdown: raked,
     brushed, sheen swept across it as it lands -- steel for a loss, and
     the same treatment in gold for a win. */
  #finishCard .place{font-size:clamp(34px,7.6vh,66px);font-weight:900;line-height:1;
    margin:clamp(2px,.7vh,6px) 0 2px;letter-spacing:-.01em;
    transform:skewX(-9deg);
    background-image:
      linear-gradient(104deg,transparent 39%,rgba(255,255,255,.95) 47%,transparent 55%),
      linear-gradient(176deg,#fff 4%,#e4ecf4 25%,#8e9daf 50%,#fff 63%,#b9c7d6 86%,#6f7d8d 100%);
    background-size:260% 100%,100% 100%;background-position:170% 0,0 0;background-repeat:no-repeat;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.5)) drop-shadow(0 0 24px rgba(154,164,174,.3));
    animation:chromeSheen .9s ease-out .42s backwards}
  /* A win gets three quick electric surges after the sheen -- the word
     snapping to white-hot and a bolt flashing on each side -- then
     settles into its gold. Struck a handful of times and done, not
     looping: the card sits on screen while the result is read, and a
     glow that never stops arcing would fight that instead of
     announcing it. A loss keeps the cold steel, which is the grade the
     rest of this card already gives it. Both animations wait out the
     card's own entrance delay, or the surge would fire at a word that
     is not on screen yet. */
  #finishCard.win .place{position:relative;
    background-image:
      linear-gradient(104deg,transparent 39%,rgba(255,255,255,.98) 47%,transparent 55%),
      linear-gradient(176deg,#fff8de 4%,#ffe488 24%,#d39c27 50%,#fffaea 62%,#ffd64a 85%,#9e6d13 100%);
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.5)) drop-shadow(0 0 30px rgba(255,214,74,.45));
    animation:chromeSheen .9s ease-out .42s backwards,winSurge 1.5s steps(1,end) 1.1s 1}
  @keyframes winSurge{
    0%,7%,10%,21%,24%,39%,42%,100%{
      filter:drop-shadow(0 3px 0 rgba(0,0,0,.5)) drop-shadow(0 0 30px rgba(255,214,74,.45))}
    8%,22%,40%{
      filter:brightness(1.9) saturate(.5) drop-shadow(0 0 10px rgba(255,255,255,.95))
             drop-shadow(0 0 44px rgba(255,214,74,.95))}
  }
  #finishCard.win .place::before,#finishCard.win .place::after{
    content:'';position:absolute;top:52%;width:22px;height:32px;
    background:linear-gradient(160deg,#fff,#ffe9a8 55%,#ffd64a);
    clip-path:polygon(58% 0,18% 54%,44% 54%,8% 100%,82% 40%,50% 40%);
    filter:drop-shadow(0 0 8px rgba(255,214,74,.9));
    opacity:0;animation:winBolt 1.5s steps(1,end) 1.1s 1}
  #finishCard.win .place::before{left:-32px;transform:translateY(-58%)}
  #finishCard.win .place::after{right:-32px;transform:translateY(-58%) scaleX(-1);animation-delay:1.12s}
  @keyframes winBolt{
    0%,7%,10%,21%,24%,39%,42%,100%{opacity:0}
    8%,22%,40%{opacity:1}
  }
  #finishCard .rtWrap{display:flex;flex-direction:column;gap:3px;
    margin:clamp(6px,1.4vh,12px) 0 clamp(10px,2.3vh,20px)}
  #finishCard .rtLabel{font-size:8px;letter-spacing:.5em;text-indent:.5em;opacity:.42;font-weight:800}
  /* the clock, as a clock: tabular, tight, and lit rather than plain white */
  #finishCard .rt{font-size:clamp(18px,3vh,26px);font-weight:900;font-variant-numeric:tabular-nums;
    letter-spacing:.01em;color:#eef5fb;text-shadow:0 0 16px rgba(160,200,245,.4)}
  #finishCard button{pointer-events:auto;width:100%;height:clamp(40px,6.2vh,54px);border-radius:16px;
    border:1px solid rgba(255,255,255,.2);color:#fff;font-size:clamp(13px,1.8vh,15px);font-weight:900;
    letter-spacing:.1em;
    background:radial-gradient(130% 100% at 50% -20%,rgba(255,255,255,.24),rgba(255,255,255,.04) 64%),
               rgba(24,30,38,.9);
    box-shadow:0 10px 24px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.26)}
  #finishCard button:active{transform:scale(.97);border-color:rgba(255,255,255,.7)}
  /* Landscape phones. Even at its clamp floors the portrait card is
     ~197px, which is over half of a 360px-tall viewport and back on top
     of the car. Here the stage line and the RACE TIME caption go (the
     card's heading and the time's own digits already say both), and
     what is left is tightened until the card fits the band main.js
     frames the car below. */
  @media (max-height:430px){
    #finishCard{padding:9px 16px 9px;border-radius:18px}
    #finishCard h2{display:none}
    #finishCard .rtLabel{display:none}
    #finishCard .ribbon{margin-bottom:3px;font-size:9px;padding:3px 9px}
    #finishCard .place{font-size:26px;margin:1px 0 0}
    #finishCard .rtWrap{margin:3px 0 7px}
    #finishCard .rt{font-size:17px}
    #finishCard button{height:33px;font-size:12px;border-radius:12px}
  }

  /* --- lap banner ------------------------------------------------------
     A checkpoint is a quiet white flash. The final lap is not: it sweeps
     in as a red bar with its own rule, and the lap counter stays lit for
     the rest of the race (see body.final-lap below) so it is impossible
     to lose track of which lap you are on. */
  #lapPopup{position:fixed;left:50%;top:25%;transform:translate(-50%,-50%);
    z-index:16;pointer-events:none;opacity:0;text-align:center;color:#fff;font-weight:900;
    padding:12px 30px;border-radius:14px;
    background:linear-gradient(90deg,rgba(8,11,15,0),rgba(8,11,15,.72) 18%,rgba(8,11,15,.72) 82%,rgba(8,11,15,0));
    text-shadow:0 3px 0 rgba(0,0,0,.7);
    transition:opacity .2s ease, transform .2s ease}
  #lapPopup.show{opacity:1}
  #lapPopup .rule{height:2px;margin:0 auto 9px;width:0;background:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.8);transition:width .34s cubic-bezier(.16,1,.3,1)}
  #lapPopup.show .rule{width:78%}
  #lapPopup .main{font-size:min(11vw,46px);line-height:1;letter-spacing:.02em;white-space:nowrap}
  #lapPopup .sub{margin-top:7px;font-size:min(3.2vw,13px);opacity:.9;letter-spacing:.3em;text-indent:.3em}
  #lapPopup{transform:translate(-50%,-50%) scale(.9)}
  #lapPopup.show{transform:translate(-50%,-50%) scale(1)}
  /* final lap: red, wider, and it arrives from the side */
  #lapPopup.final{transform:translate(-50%,-50%) translateX(-42px) scale(.96);
    background:linear-gradient(90deg,rgba(60,6,6,0),rgba(74,7,7,.86) 16%,rgba(74,7,7,.86) 84%,rgba(60,6,6,0))}
  #lapPopup.final.show{transform:translate(-50%,-50%) scale(1)}
  #lapPopup.final .rule{background:#ff4133;box-shadow:0 0 16px rgba(255,65,51,.95)}
  #lapPopup.final .main{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.7),0 0 26px rgba(255,65,51,.8)}
  #lapPopup.final .sub{color:#ff8b80;opacity:1}

  /* Held for the whole final lap, on the lap counter alone. A red frame
     around the screen was tried here and read as damage -- as though the
     race was going badly -- rather than as "last lap". */
  body.final-lap .hud #lap{color:#ffc24a;
    text-shadow:0 2px 5px rgba(0,0,0,.85),0 0 16px rgba(255,194,74,.85)}

  /* Icon row: PAUSE, SOUND, VIEW. Sits right under the LAP/POS block in
     the same top-left corner, not down the left EDGE the way the old
     vertical stack did -- a row reads as part of that HUD block, and it
     keeps well clear of the minimap over on the right (132px box,
     starting no closer than screenW-144, against a row that tops out
     under 170px even at three icons with VIEW's badge).
     VIEW is placed LAST, not first, so its badge -- the only one left
     now that STAGE is gone -- hangs off the row's outer edge instead of
     into the 8px gap before a neighbour it would otherwise overlap. */
  .iconRow{position:fixed;left:14px;z-index:15;display:flex;gap:8px;
    top:calc(max(10px,env(safe-area-inset-top)) + 38px)}
  .iconBtn{
    position:relative;
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.30);
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(255,255,255,.24), rgba(255,255,255,.04) 62%),
      rgba(16,20,25,.5);
    color:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.28),
               inset 0 -2px 6px rgba(0,0,0,.24);
    backdrop-filter:blur(8px) saturate(1.2);-webkit-backdrop-filter:blur(8px) saturate(1.2);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .iconBtn .icon{width:22px;height:22px;display:block;overflow:visible}
  .iconBtn:active{transform:scale(.92);
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(255,255,255,.4), rgba(255,255,255,.1) 62%),
      rgba(40,48,56,.62);
    border-color:rgba(255,255,255,.7)}
  .iconBtn[disabled]{opacity:.4}
  /* Bottom-right badge, for VIEW's live zoom level. Sits half off the
     circle's own edge, the way a notification count sits on an app icon. */
  .iconBtn .badge{
    position:absolute;right:-4px;bottom:-6px;min-width:20px;height:16px;padding:0 4px;
    border-radius:999px;background:rgba(6,9,12,.92);border:1px solid rgba(255,255,255,.4);
    font-size:9px;font-weight:900;line-height:14px;text-align:center;
    font-variant-numeric:tabular-nums;color:#fff;pointer-events:none}

  /* Above the stage picker (40), so opening one over the other can never
     leave the pause card buried. */
  #pauseOverlay{z-index:45;background:rgba(6,8,11,.58);backdrop-filter:blur(3px);
    pointer-events:auto}
  #pauseCard{
    width:min(340px,82vw);padding:22px 20px 18px;border-radius:22px;text-align:center;
    background:linear-gradient(180deg,rgba(18,23,29,.97),rgba(7,9,12,.98));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 26px 70px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.14);
    animation:cardIn .28s cubic-bezier(.16,1,.3,1);pointer-events:auto}
  #pauseCard h2{margin:0 0 16px;font-size:13px;letter-spacing:.42em;text-indent:.42em;
    opacity:.62;font-weight:900}
  #pauseCard button{
    display:block;width:100%;margin-top:9px;height:50px;border-radius:14px;
    border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:900;
    letter-spacing:.12em;
    background:radial-gradient(130% 100% at 50% -20%,rgba(255,255,255,.2),rgba(255,255,255,.04) 64%),
               rgba(24,30,38,.9);
    box-shadow:0 8px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #pauseCard button:active{transform:scale(.97);border-color:rgba(255,255,255,.7)}
  /* Resume is the one you want under your thumb without reading, so it
     is the only one that carries colour. */
  #pauseResume{border-color:rgba(120,205,255,.7)!important;
    background:radial-gradient(130% 100% at 50% -20%,rgba(150,225,255,.38),rgba(60,150,220,.14) 64%),
               rgba(12,30,44,.92)!important}
  #pauseCard .sub{margin-top:14px;font-size:10px;letter-spacing:.2em;opacity:.4;font-weight:700}

  /* --- title screen -----------------------------------------------------
     The one screen before the game exists at all: boot() is not called
     until START is pressed (see the module script), so nothing here costs
     a frame of the race -- no canvas, no asset decode, just this image and
     three lines of text. It sits above everything (z-index above the
     stage-select overlay, the highest z-index otherwise in use) and is
     removed from layout entirely once it has faded, rather than left
     parked at opacity 0 forever. */
  #titleScreen{
    position:fixed;inset:0;z-index:200;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 34px) 20px calc(env(safe-area-inset-bottom) + 40px);
    background:

     top. Absolutely positioned so it is centred on the SCREEN rather
     than on the space left under the logo, which is what "centre" has
     to mean once a second row is added below START. */

    position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);
    max-width:360px;margin:0 auto}
  #titleScreen #titleStart{
    width:100%;height:64px;border-radius:18px;
    border:1px solid rgba(255,255,255,.4);
    background:
      radial-gradient(130% 120% at 50% -20%,rgba(255,255,255,.32),rgba(255,255,255,.05) 62%),
      rgba(20,24,30,.62);

               0 0 0 0 rgba(255,59,48,0);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    animation:titleStartPulse 2.2s ease-in-out infinite;
    transition:transform .12s ease,background .12s ease,box-shadow .12s ease}
  #titleScreen #titleStart:active{
    transform:scale(.96);animation-play-state:paused;
    background:
      radial-gradient(130% 120% at 50% -20%,rgba(255,255,255,.5),rgba(255,255,255,.12) 62%),
      rgba(40,20,20,.7);
    box-shadow:0 0 0 6px rgba(255,59,48,.14),0 0 30px rgba(255,59,48,.5),
               inset 0 1px 0 rgba(255,255,255,.4)}

    0%,100%{box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.32),
                        0 0 0 0 rgba(255,59,48,.35)}
    50%{box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.32),
                    0 0 0 9px rgba(255,59,48,0)}
  }

<div class="hud">
  <div class="top">
    <div><div id="lap">LAP 1/3</div><div id="pos">POS 2/2</div></div>
    <div id="time">00:00.000</div>
  </div>
  <div class="note" id="note">v2.0 · PIXI RENDER CORE</div>
  <div class="speed"><span id="speed">0</span><small>km/h</small></div>
  <div class="nitroWrap" id="nitroWrap">
    <div class="nitroCells" id="nitroCells">
      <div class="nitroCell"><i></i></div>
      <div class="nitroCell"><i></i></div>
      <div class="nitroCell"><i></i></div>
    </div>
    <div class="nitroBurst"><i id="nitroBurst"></i></div>
    <div class="nitroLabel" id="nitroLabel">NITRO</div>
  </div>
</div>

<div class="controls">
  <div class="side"><button id="left">◀</button><button id="right">▶</button></div>
  <div class="side"><button id="brake">BRAKE</button><button id="nitro">NITRO<span class="cnt" id="nitroCnt">×0</span></button></div>
</div>
<div class="iconRow">
  <button id="pauseBtn" class="iconBtn" aria-label="pause">
    <svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4.2" height="16" rx="1.3" fill="currentColor"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.3" fill="currentColor"/></svg>
  </button>
  <button id="soundBtn" class="iconBtn" aria-label="toggle sound"></button>
  <button id="zoomBtn" class="iconBtn" aria-label="camera zoom">
    <svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="badge" id="zoomBadge">1/3</span>
  </button>
</div>

<div class="overlay" id="pauseOverlay" hidden>
  <div id="pauseCard">
    <h2>一時停止中</h2>
    <button id="pauseResume">再開</button>
    <button id="pauseRestart">ステージをやり直す</button>
    <button id="pauseTitle">タイトルへ戻る</button>
    <div class="sub" id="pauseStage">STAGE 1</div>
  </div>
</div>

<div id="loading" class="hide">LOADING…</div>

<div class="overlay" id="vsOverlay">
  <div id="vsCard">
    <div class="stage" id="vsStage">STAGE 1</div>
    <div class="rival" id="vsRival">悪魔のアイツ</div>
    <div class="vs">VS</div>
  </div>
</div>

<div class="overlay" id="signalOverlay" hidden>
  <div id="startSignal">
    <div class="gantry">
      <div class="lamp" id="sig1"></div>
      <div class="lamp" id="sig2"></div>
      <div class="lamp" id="sig3"></div>
      <div class="lamp" id="sig4"></div>
      <div class="lamp" id="sig5"></div>
    </div>
    <div class="count" id="startCount"><span class="rake" id="startCountText">3</span></div>
    <div class="cue" id="startCue">GET READY</div>
  </div>
</div>

<div id="lapPopup">
  <div class="rule"></div>
  <div id="lapPopupMain" class="main">LAP 2/3</div>
  <div id="lapPopupSub" class="sub">CHECKPOINT</div>
</div>

<div class="overlay" id="finishOverlay" hidden>
  <div id="finishCard">
    <div class="ribbon" id="finishRibbon">FINISHED</div>
    <h2 id="finishStage">STAGE 1 CLEAR</h2>
    <div class="place" id="finishPlace">WIN</div>
    <div class="rtWrap"><span class="rtLabel">RACE TIME</span><span class="rt" id="finishTime">00:00.000</span></div>
    <button id="retryBtn">NEXT STAGE</button>
  </div>
</div>

<script type="module">
(async()=>{
  const loading=document.getElementById('loading');
  const titleScreen=document.getElementById('titleScreen');
  const titleStart=document.getElementById('titleStart');

  const hideTitle=()=>{
    titleScreen.classList.add('leaving');
    titleScreen.addEventListener('transitionend',()=>{titleScreen.hidden=true},{once:true});
  };
  // Coming BACK to the title (from pause): un-hide first, then drop
  // `leaving` after a reflow, or the browser coalesces the two and the
  // fade never runs.
  const showTitle=()=>{
    titleScreen.hidden=false;
    void titleScreen.offsetWidth;
    titleScreen.classList.remove('leaving');
    titleStart.disabled=false;
  };
  // Set once the game is up: what START does on every press after the
  // first, since boot() must not run twice.
  let resumeFromTitle=null;
  // Created synchronously inside the START tap handler below, not here
  // and not inside startGame() after its first `await` -- browsers only
  // allow audio to begin from inside a synchronous user-gesture handler,
  // and an AudioContext created (or even just resumed) after an await has
  // already left that window on some engines (Safari/iOS especially).
  let audioCtx=null;

  // Nothing below this point runs until the player taps START -- boot()
  // does real work (PIXI init, asset decode for every car photo), and
  // none of it needs to happen behind a screen nobody has asked to pass
  // yet. The title fades out in parallel with boot() rather than waiting
  // on it, so the loading text is the only thing standing between START
  // and the grid on a slow device; on a fast one they never overlap.
  const startGame=async()=>{
    loading.classList.remove('hide');
    try {
      const {boot}=await import('./src/main.js');
      const {NITRO,PHYSICS}=await import('./src/config.js');
      const el=(id)=>document.getElementById(id);
      const {game,app,stages}=await boot({stageId:1,audioCtx});
      loading.classList.add('hide');
      const LAST_STAGE=Math.max(...Object.keys(stages).map(Number));
      const zoomBtn=el('zoomBtn'),zoomBadge=el('zoomBadge');
      const zoomCount=game.zoomLevels?.length||3;
      zoomBadge.textContent=`${(game.zoomLevel||0)+1}/${zoomCount}`;
      zoomBtn.addEventListener('pointerdown',e=>{
        e.preventDefault();
        game.audio?.click();
        const level=game.cycleZoom();
        zoomBadge.textContent=`${level+1}/${zoomCount}`;
      });
      const bind=(id,key)=>{const b=el(id);const on=e=>{e.preventDefault();game.input[key]=true;b.classList.add('pressed');try{b.setPointerCapture(e.pointerId)}catch{}};const off=e=>{e.preventDefault();game.input[key]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)};
      bind('left','left');bind('right','right');bind('brake','brake');
      const nitroControl=el('nitro');
      nitroControl.addEventListener('pointerdown',e=>{e.preventDefault();nitroControl.classList.add('pressed');game.player.tryNitro();try{nitroControl.setPointerCapture(e.pointerId)}catch{}});
      const releaseNitro=e=>{nitroControl.classList.remove('pressed')};
      nitroControl.addEventListener('pointerup',releaseNitro);nitroControl.addEventListener('pointercancel',releaseNitro);nitroControl.addEventListener('lostpointercapture',releaseNitro);
      addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')game.input.left=true;if(e.key==='ArrowRight'||e.key==='d')game.input.right=true;if(e.key==='ArrowDown'||e.key==='s')game.input.brake=true;if(e.key===' ')game.player.tryNitro()});
      addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')game.input.left=false;if(e.key==='ArrowRight'||e.key==='d')game.input.right=false;if(e.key==='ArrowDown'||e.key==='s')game.input.brake=false});
      const speedEl=el('speed'),nitroBtn=el('nitro'),nitroCnt=el('nitroCnt'),nitroWrap=el('nitroWrap'),
        nitroBurstEl=el('nitroBurst'),nitroLabel=el('nitroLabel'),
        nitroCells=Array.from(el('nitroCells').children).map(c=>({box:c,fill:c.firstElementChild})),
        lapEl=el('lap'),posEl=el('pos'),timeEl=el('time');
      // One cell per banked charge: filled cells are charges in hand, the cell
      // after them is the meter working toward the next. The label doubles as
      // the chain cue -- CHAIN READY is up exactly while a press would extend
      // the running burst instead of being refused, so the player can see the
      // window rather than having to guess at it.
      const paintNitro=(p)=>{
        const stock=p.nitroStock,part=p.nitroCharge/100;
        for(let i=0;i<nitroCells.length;i++){
          const v=i<stock?1:(i===stock?part:0);
          nitroCells[i].fill.style.transform=`scaleX(${v})`;
          nitroCells[i].box.classList.toggle('full',i<stock);
        }
        nitroWrap.classList.toggle('firing',p.boosting);
        nitroBurstEl.style.transform=`scaleX(${p.boosting?Math.min(1,p.boostTimer/PHYSICS.boostDuration):0})`;
        nitroCnt.textContent='×'+stock;
        const canFire=stock>0&&(!p.boosting||p.boostTimer<=NITRO.chainWindow);
        nitroBtn.classList.toggle('ready',canFire);
        nitroLabel.textContent=p.boosting?(canFire?'NITRO · CHAIN READY':'NITRO · FIRING'):'NITRO';
      };
      const vsOverlay=el('vsOverlay'),vsStage=el('vsStage'),vsRival=el('vsRival'),signalOverlay=el('signalOverlay');
      const startLamps=[el('sig1'),el('sig2'),el('sig3'),el('sig4'),el('sig5')];
      const startCount=el('startCount'),startCountText=el('startCountText'),startCue=el('startCue');
      const finishOverlay=el('finishOverlay'),finishStage=el('finishStage'),finishPlace=el('finishPlace'),finishTime=el('finishTime'),finishCard=el('finishCard'),finishRibbon=el('finishRibbon'),lapPopup=el('lapPopup'),lapPopupMain=el('lapPopupMain'),lapPopupSub=el('lapPopupSub'),stageBtn=el('retryBtn');

      // --- start lights ---
      // The five lamps fill evenly across the countdown and all turn green
      // together on zero, which is the moment the numeral becomes GO and the
      // screen blinks. `shownCount` exists so the numeral's punch
      // animation is retriggered once per change rather than every frame.
      const COUNTDOWN=3.2, GO_AT=0.55, PADS_UP_AT=1.35;
      let shownCount=null;
      const paintStart=(t)=>{
        const go=t<=GO_AT;
        const lit=go?5:Math.min(5,Math.floor((COUNTDOWN-t)/((COUNTDOWN-GO_AT)/5))+1);
        for(let i=0;i<startLamps.length;i++){
          startLamps[i].className='lamp'+(go?' go':(i<lit?' on':''));
        }
        const label=go?'GO!':String(Math.min(3,Math.ceil((t-GO_AT)/((COUNTDOWN-GO_AT)/3))));
        if(label!==shownCount){
          shownCount=label;
          startCountText.textContent=label;
          startCount.classList.remove('punch');
          void startCount.offsetWidth;
          startCount.classList.add('punch');
          if(label==='GO!')game.audio?.go();
          else game.audio?.countBeep(+label);
        }
        startCount.classList.toggle('go',go);
        signalOverlay.classList.toggle('go',go);
        startCue.textContent=go?'':'GET READY';
      };
      const resetStart=()=>{
        shownCount=null;
        signalOverlay.classList.remove('go');
        startCount.classList.remove('go','punch');
      };
      const syncStageUI=()=>{
        vsStage.textContent=game.cfg.name;
        vsRival.textContent=game.cfg.rivalName;
        finishStage.textContent=`${game.cfg.name} CLEAR`;
        stageBtn.textContent=game.stageId<LAST_STAGE?'NEXT STAGE':'RETRY FINAL STAGE';
        lapEl.textContent=`LAP 1/${game.race?.totalLaps??3}`;
        posEl.textContent='POS 2/2';
        timeEl.textContent='00:00.000';
      };
      syncStageUI();
      const fmtTime=s=>{const ms=Math.max(0,Math.floor(s*1000)),m=Math.floor(ms/60000),sec=Math.floor((ms%60000)/1000),cs=ms%1000;return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(cs).padStart(3,'0')}`};
      let shownFinish=false,finishDelay=0,lapPopupTimer=0;
      // The final lap gets its own banner AND leaves the HUD flagged until
      // the race ends -- a banner that has already faded cannot answer "which
      // lap am I on" three corners later, which is what makes the last lap
      // easy to miss.
      const showLapPopup=(lap,total)=>{
        const final=lap===total;
        if(final)game.audio?.finalLap();else game.audio?.lapChime();
        lapPopupMain.textContent=final?'FINAL LAP':`LAP ${lap}/${total}`;
        lapPopupSub.textContent=final?`LAP ${total} OF ${total}`:'CHECKPOINT';
        lapPopup.classList.remove('show');
        lapPopup.classList.toggle('final',final);
        void lapPopup.offsetWidth;
        lapPopup.classList.add('show');
        lapPopupTimer=final?2.2:1.45;
        if(final)document.body.classList.add('final-lap');
      };
      const clearBanners=()=>{
        lapPopup.classList.remove('show','final');
        document.body.classList.remove('final-lap');
        resetStart();
      };
      app.ticker.add(ticker=>{
        const dt=Math.min(.033,ticker.deltaMS/1000),p=game.player;
        speedEl.textContent=Math.max(0,Math.round(p.displaySpeed));
        paintNitro(p);
        if(lapPopupTimer>0){lapPopupTimer-=dt;if(lapPopupTimer<=0)lapPopup.classList.remove('show')}
        const race=game.race;
        if(!race)return;
        if(race.lapAnnounce!=null){showLapPopup(race.lapAnnounce,race.totalLaps);race.lapAnnounce=null}
        const lap=Math.min(game.playerEntry.progress.lap,race.totalLaps);
        lapEl.textContent=`LAP ${lap}/${race.totalLaps}`;
        posEl.textContent=`POS ${race.positionOf(game.playerEntry)}/2`;
        timeEl.textContent=fmtTime(race.time);
        vsOverlay.classList.toggle('vis',race.state==='vs');
        signalOverlay.hidden=race.state!=='countdown';
        if(race.state==='countdown')paintStart(race.countdown);
        // Pads are away for the VS card and most of the countdown, and rise
        // with about a second to spare -- settled and pressable well before
        // the lights go green at 0.55.
        document.body.classList.toggle('pre-race',
          race.state==='vs'||(race.state==='countdown'&&race.countdown>PADS_UP_AT));
        // Retract the same way once the race is over, mirroring the grid
        // shot -- see the 'finished' branch of Game#startCameraBlend.
        document.body.classList.toggle('post-race', race.state==='finished');
        if(race.state==='finished'&&!shownFinish){
          // The red frame is a "you are on the last lap" cue; once the line
          // is crossed it is answering a question nobody is asking, and it
          // fights the finish effect for the same edges.
          document.body.classList.remove('final-lap');
          // Likewise the lap banner itself: crossing the line while "FINAL
          // LAP" is still on screen (its own 2.2s timer can easily still be
          // running) used to leave it up to fade out on its own schedule,
          // ghosting behind the result card that lands at the same spot.
          // The finish supersedes it outright.
          lapPopupTimer=0;
          lapPopup.classList.remove('show');
          finishDelay+=dt;
          // Held back until the finish effect (render/finishfx.js) has run
          // its banner and title and cleared out of the way.
          if(finishDelay>=1.9){
            shownFinish=true;
            const place=race.positionOf(game.playerEntry);
            const won=place===1;
            game.audio?.fanfare(won);
            finishCard.classList.toggle('win',won);
            finishRibbon.textContent=won?'WINNER':'FINISHED';
            finishStage.textContent=won?`${game.cfg.name} CLEAR`:`${game.cfg.name} RESULT`;
            finishPlace.textContent=won?'WIN':'LOSE';
            finishTime.textContent=fmtTime(game.playerEntry.progress.finishTime??race.time);
            stageBtn.textContent=(won&&game.stageId<LAST_STAGE)?'NEXT STAGE':(won?'RETRY FINAL STAGE':'RETRY');
            finishOverlay.hidden=false;
            // Side lightning lands WITH the card, not back at the line
            // -- the strike is what announces the result.
            game.strikeResultBolts(won);
          }
        }
      });
      // Load a stage and put the whole shell back to its start-of-race
      // state. The result card's button and the pause card's "retry"
      // both need exactly this, and used to carry their own copy of it.
      // The manual stage picker that also used this (a button + a list
      // overlay to jump to any stage) was a testing convenience, not
      // part of the shipped game, and has been removed -- progression is
      // NEXT STAGE / RETRY only now.
      const goToStage=(id)=>{
        shownFinish=false;finishDelay=0;lapPopupTimer=0;
        clearBanners();
        finishOverlay.hidden=true;
        game.loadStage(id);
        syncStageUI();
      };

      stageBtn.addEventListener('pointerdown',e=>{
        e.preventDefault();
        game.audio?.click();
        const place=game.race?.positionOf(game.playerEntry)??2;
        goToStage((place===1&&game.stageId<LAST_STAGE)?game.stageId+1:game.stageId);
      });

      // --- pause ---
      // The ticker drives game.update AND the HUD ticker below, so
      // stopping it freezes the race, the clock and the rendering
      // together. Both tickers clamp dt, so the first frame after a long
      // pause cannot jump the car down the road.
      const pauseBtn=el('pauseBtn'),pauseOverlay=el('pauseOverlay'),pauseStage=el('pauseStage');
      const openPause=()=>{
        // Not over the result card: that is already a stopped race with
        // its own choices on screen.
        if(!pauseOverlay.hidden||!finishOverlay.hidden)return;
        if(titleScreen.hidden===false)return;
        pauseStage.textContent=`${game.cfg.name} · ${game.cfg.rivalName}`;
        pauseOverlay.hidden=false;
        app.ticker.stop();
        // The ticker freezing does not silence the engine drone on its
        // own -- it just stops calling update(), which leaves whatever
        // setTargetAtTime ramp was already scheduled to keep running.
        game.playerEngine?.silence();
        game.rivalEngine?.silence();
      };
      const closePause=()=>{pauseOverlay.hidden=true;app.ticker.start()};
      pauseBtn.addEventListener('pointerdown',e=>{e.preventDefault();game.audio?.click();openPause()});
      el('pauseResume').addEventListener('pointerdown',e=>{e.preventDefault();game.audio?.click();closePause()});
      el('pauseRestart').addEventListener('pointerdown',e=>{
        e.preventDefault();
        game.audio?.click();
        pauseOverlay.hidden=true;
        goToStage(game.stageId);
        app.ticker.start();
      });
      el('pauseTitle').addEventListener('pointerdown',e=>{
        e.preventDefault();
        game.audio?.click();
        pauseOverlay.hidden=true;
        // Reset now rather than on the way back in, so the title is
        // sitting in front of a fresh grid and START just releases it.
        goToStage(game.stageId);
        showTitle();   // ticker stays stopped until START
      });
      // Desktop convenience; the phone has the button.
      addEventListener('keydown',e=>{
        if(e.key!=='Escape')return;
        if(pauseOverlay.hidden)openPause();else closePause();
      });

      // --- sound toggle ---
      const soundBtn=el('soundBtn');
      // Speaker with sound waves, and the same speaker with an X over the
      // waves for muted/unavailable -- swapped wholesale rather than
      // toggling two overlaid icons, since only one is ever shown.
      const SOUND_ICON_ON='<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M4 9.5v5h3.3L12 18V6L7.3 9.5H4z" fill="currentColor"/><path d="M15.8 9.2a4.2 4.2 0 010 5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.3 7a7.8 7.8 0 010 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".65"/></svg>';
      const SOUND_ICON_OFF='<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M4 9.5v5h3.3L12 18V6L7.3 9.5H4z" fill="currentColor"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      if(!game.audio){
        // Construction can fail (no Web Audio support) or never have been
        // attempted (audioCtx itself failed to construct) -- either way
        // there is nothing to toggle, so say so rather than leave a
        // button that looks live but does nothing.
        soundBtn.innerHTML=SOUND_ICON_OFF;
        soundBtn.setAttribute('aria-label','sound unavailable');
        soundBtn.disabled=true;
      } else {
        const syncSoundLabel=()=>{
          soundBtn.innerHTML=game.audio.muted?SOUND_ICON_OFF:SOUND_ICON_ON;
          soundBtn.setAttribute('aria-label',game.audio.muted?'unmute sound':'mute sound');
        };
        syncSoundLabel();
        soundBtn.addEventListener('pointerdown',e=>{
          e.preventDefault();
          // Click first: fired on the outgoing master gain if this press
          // is the one turning sound off, so muting is itself heard
          // rather than silently taking effect.
          game.audio.click();
          game.audio.setMuted(!game.audio.muted);
          syncSoundLabel();
        });
      }

      resumeFromTitle=()=>{app.ticker.start()};

      window.__game=game;window.__app=app;
    } catch(err) {
      loading.textContent='ERROR: '+(err?.message||err);console.error(err);
    }
  };

  titleStart.addEventListener('pointerdown',e=>{
    e.preventDefault();
    titleStart.disabled=true;
    hideTitle();
    // Synchronous, before anything else in this handler runs -- see the
    // comment on `audioCtx` above. Wrapped: construction can throw on a
    // browser with no Web Audio, and that has to stay a silent game
    // rather than a dead START button.
    if(!audioCtx){
      try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
      catch{audioCtx=null;}
    }
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
    if(resumeFromTitle)resumeFromTitle();
    else startGame();
  });
})();
</script>
</body>
</html>
