<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#161a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TOPDOWN RACER</title>
<style>
  /* Sized so the whole four-pad row always FITS: 2*ctrlW + 2*actW + 2 gaps
     + the side padding has to stay under 100vw, or the last pad runs off
     the right edge (which is exactly what the old clamp()s did -- at 430px
     they asked for 470px of row). vw-driven with a px ceiling keeps that
     true at every width instead of only at the one it was eyeballed on.
     The pads are taller than they are wide: on a phone the thumb has
     vertical room to spare and none horizontally, so height is where the
     extra target area actually comes from. */
  :root{ --ctrlW: min(21vw, 106px); --actW: min(23vw, 118px); --ctrlH: min(31vw, 152px); }
  html,body{margin:0;height:100%;overflow:hidden;background:#161a1e;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #app{position:fixed;inset:0}
  #app canvas{display:block;width:100%;height:100%}

  .hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:700;
    text-shadow:0 2px 5px rgba(0,0,0,.75)}
  .hud .top{position:absolute;top:max(10px,env(safe-area-inset-top));left:14px;right:14px;
    display:flex;justify-content:space-between;align-items:flex-start;font-size:14px}
  .hud .speed{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--ctrlH) + 40px);
    text-align:center;font-size:22px;letter-spacing:.02em}
  .hud .speed small{font-size:11px;opacity:.75;margin-left:4px;font-weight:600}
  .hud .nitroWrap{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + var(--ctrlH) + 14px);
    width:min(54vw,238px)}
  .hud .nitroCells{display:flex;gap:5px}
  .hud .nitroCell{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.13);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);overflow:hidden}
  .hud .nitroCell i{display:block;height:100%;transform-origin:left center;transform:scaleX(0);
    background:linear-gradient(90deg,#2f9ae8,#7fe6ff)}
  .hud .nitroCell.full i{background:linear-gradient(90deg,#54c8ff,#c2f7ff);
    box-shadow:0 0 12px rgba(120,220,255,.85)}
  /* Burst meter: only up while a charge is actually running. Normalised to
     one charge and clamped, so a chained run simply holds full until the
     last charge starts draining. */
  .hud .nitroBurst{height:4px;margin-top:4px;border-radius:3px;overflow:hidden;
    background:rgba(255,255,255,.10);opacity:0;transition:opacity .12s ease}
  .hud .nitroWrap.firing .nitroBurst{opacity:1}
  .hud .nitroBurst i{display:block;height:100%;transform-origin:left center;transform:scaleX(0);
    background:linear-gradient(90deg,#ffb23a,#ffe9a8)}
  .hud .nitroLabel{font-size:9px;opacity:.72;text-align:center;margin-top:4px;letter-spacing:.16em}
  .hud .nitroWrap.firing .nitroLabel{opacity:1;color:#ffd489}
  .hud .note{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 46px);
    font-size:11px;opacity:.5;font-weight:600}

  .controls{position:fixed;left:0;right:0;bottom:0;
    padding:0 9px calc(env(safe-area-inset-bottom) + 12px);
    display:flex;justify-content:space-between;pointer-events:none}
  /* The pads stay out of the way while the grid is being shown -- the
     camera is closed right in on the two cars, and four slabs across the
     bottom third are the one thing in frame that is not the race. They
     rise back in just before the lights go green, staggered so it reads
     as the controls arriving rather than a panel appearing.
     `pointer-events` goes with them, so a pad off screen cannot be hit.
     The press feedback (transform/background/border/shadow) has to stay
     quick, so it keeps its own short durations here while only the rise
     is slow -- one transition list covering both, or the press would ease
     over a third of a second. */
  body.pre-race .controls{pointer-events:none}
  body.pre-race .controls .side{pointer-events:none}
  /* `transition:none` on the way IN is the point: the pads are simply not
     there, they are never seen going away. Without it the page opens with
     them up, the first frame of the countdown pushes them down, and the
     start reads as the controls leaving and coming back. The body carries
     this class in the markup so the very first painted frame is already
     without them. Only the rise animates, from the rule above. */
  body.pre-race .controls button{
    opacity:0;transform:translateY(150%);
    transition:none;transition-delay:0s}
  .controls .side{display:flex;gap:9px;pointer-events:auto}
  /* Glass pad rather than a flat translucent square: a top-lit gradient over
     a dark blurred base, a hairline rim, and an inset highlight along the top
     edge. The dark base is what keeps a white glyph readable over bright
     track as well as over asphalt -- the old .14-white fill washed out
     completely against a concrete apron. */
  .controls button{width:var(--ctrlW);height:var(--ctrlH);
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.26);border-radius:24px;
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(255,255,255,.26), rgba(255,255,255,.04) 62%),
      rgba(16,20,25,.44);
    color:#fff;font-size:clamp(22px,5.6vw,30px);font-weight:800;line-height:1;
    box-shadow:0 8px 22px rgba(0,0,0,.38),
               inset 0 1px 0 rgba(255,255,255,.34),
               inset 0 -3px 8px rgba(0,0,0,.28);
    backdrop-filter:blur(10px) saturate(1.25);-webkit-backdrop-filter:blur(10px) saturate(1.25);
    transition:transform .36s cubic-bezier(.16,1,.3,1),opacity .24s ease,
               background .07s ease,border-color .07s ease,box-shadow .07s ease}
  /* left to right as they come up */
  #left{transition-delay:0s}
  #right{transition-delay:.05s}
  #brake{transition-delay:.10s}
  #nitro{transition-delay:.15s}
  /* a press must not ease -- snap the scale, keep the rise smooth */
  .controls button:active,.controls button.pressed{transition-duration:.07s;transition-delay:0s}
  .controls button:active,.controls button.pressed{
    transform:scale(.94);
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(255,255,255,.5), rgba(255,255,255,.14) 62%),
      rgba(40,48,56,.58);
    border-color:rgba(255,255,255,.85);
    box-shadow:0 0 0 5px rgba(255,255,255,.10),0 0 26px rgba(255,255,255,.26),
               inset 0 1px 0 rgba(255,255,255,.5)
  }
  #left,#right{font-size:clamp(26px,6.4vw,34px)}
  #nitro,#brake{width:var(--actW);font-size:clamp(14px,3.6vw,18px);letter-spacing:.06em;font-weight:900;
    flex-direction:column;gap:5px}
  /* NITRO stays dim until a press would actually fire -- stock in hand and,
     mid-burst, inside the chain window. That is the no-wasted-press rule
     from config.js NITRO, shown rather than explained. */
  #nitro{border-color:rgba(120,205,255,.34)}
  #nitro.ready{border-color:rgba(143,222,255,.9);
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(150,225,255,.42), rgba(60,150,220,.16) 62%),
      rgba(12,30,44,.5);
    box-shadow:0 8px 22px rgba(0,0,0,.38),0 0 22px rgba(73,183,255,.42),
               inset 0 1px 0 rgba(200,240,255,.5)}
  #nitro:active,#nitro.pressed{border-color:rgba(190,240,255,1);
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(200,244,255,.62), rgba(80,180,240,.3) 62%),
      rgba(18,52,74,.62);
    box-shadow:0 0 0 5px rgba(73,183,255,.14),0 0 32px rgba(73,183,255,.66),
               inset 0 1px 0 rgba(225,250,255,.6)}
  #nitro .cnt{font-size:1.05em;opacity:.9;letter-spacing:0;font-variant-numeric:tabular-nums}
  #nitro.ready .cnt{opacity:1;text-shadow:0 0 12px rgba(143,222,255,.9)}
  #brake:active,#brake.pressed{border-color:rgba(255,190,190,.95);
    background:
      radial-gradient(125% 100% at 50% -10%, rgba(255,190,190,.5), rgba(210,80,80,.22) 62%),
      rgba(56,20,20,.58);
    box-shadow:0 0 0 5px rgba(255,92,92,.12),0 0 28px rgba(255,92,92,.4),
               inset 0 1px 0 rgba(255,220,220,.5)}
  /* Short viewports (landscape phones): tall pads would eat the road, and
     there is width to spare there, so height comes off the viewport
     instead of the width. */
  @media (max-height:520px){
    :root{ --ctrlW: min(15vw, 116px); --actW: min(17vw, 132px); --ctrlH: min(27vh, 124px); }
    .controls{padding:0 10px calc(env(safe-area-inset-bottom) + 8px)}
  }

  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#9fb0bd;font-size:13px;letter-spacing:.14em;background:#161a1e;z-index:20}
  #loading.hide{display:none}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:15;color:#fff;font-weight:800;text-align:center}
  .overlay[hidden]{display:none}

  #vsCard{background:rgba(10,13,17,.82);border:1px solid rgba(255,255,255,.14);
    border-radius:20px;padding:26px 34px;backdrop-filter:blur(6px)}
  #vsCard .stage{font-size:13px;opacity:.7;letter-spacing:.14em;margin-bottom:6px}
  #vsCard .vs{font-size:15px;color:#ff6a6a;letter-spacing:.2em;margin:10px 0}
  #vsCard .rival{font-size:26px}

  /* --- start ---------------------------------------------------------
     A start-gantry light bar rather than three dots: five lamps fill
     left to right through the countdown, the numeral punches over them
     on every change, and the screen blinks once as they go green. */
  /* lifted off centre so the numeral never lands on top of the grid --
     the cars sit at the middle of the screen and the rig is the same size
     as they are */
  #startSignal{display:flex;flex-direction:column;align-items:center;gap:14px;
    transform:translateY(-16vh)}
  #startSignal .gantry{display:flex;gap:min(3.4vw,18px);padding:min(2.6vw,14px) min(4vw,22px);
    border-radius:999px;background:linear-gradient(180deg,rgba(26,31,37,.96),rgba(9,11,14,.96));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18)}
  #startSignal .lamp{width:min(7vw,34px);height:min(7vw,34px);border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #3a2020, #170c0c 70%);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.10);
    transition:background .09s ease, box-shadow .09s ease}
  #startSignal .lamp.on{
    background:radial-gradient(circle at 38% 32%, #ff9a90, #e3231a 66%);
    box-shadow:0 0 22px rgba(255,59,48,.85),0 0 46px rgba(255,59,48,.45),
               inset 0 0 0 1px rgba(255,255,255,.28)}
  #startSignal .lamp.go{
    background:radial-gradient(circle at 38% 32%, #b6ffc6, #16c93f 66%);
    box-shadow:0 0 26px rgba(61,220,90,.95),0 0 60px rgba(61,220,90,.5),
               inset 0 0 0 1px rgba(255,255,255,.3)}
  #startSignal .count{font-size:min(23vw,122px);line-height:1;font-weight:900;
    letter-spacing:-.04em;font-variant-numeric:tabular-nums;
    text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 40px rgba(255,255,255,.28)}
  #startSignal .count.go{color:#5cf07c;
    text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 46px rgba(92,240,124,.85)}
  /* re-triggered per numeral by removing and re-adding the class */
  #startSignal .count.punch span{display:inline-block;animation:countPunch .42s cubic-bezier(.16,1,.3,1)}
  @keyframes countPunch{
    0%{transform:scale(2.1);opacity:0;filter:blur(6px)}
    55%{opacity:1;filter:blur(0)}
    100%{transform:scale(1);opacity:1}
  }
  /* fixed height: the cue empties on GO, and without this the numeral
     jumps up the screen at the exact moment it should be holding still */
  #startSignal .cue:not(:empty){font-size:min(3.4vw,15px);letter-spacing:.42em;
    text-indent:.42em;font-weight:800;padding:6px 16px;border-radius:999px;
    background:rgba(6,9,12,.66);border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(4px)}
  /* reserved even when empty, so clearing the text on GO does not shunt
     the numeral up the screen at the moment it should be holding still */
  #startSignal .cue{min-height:2.1em;display:flex;align-items:center}
  /* one full-screen blink on the green */
  #signalOverlay.go::after{content:'';position:absolute;inset:0;background:#eaf7ff;
    animation:goFlash .34s ease-out forwards;pointer-events:none}
  @keyframes goFlash{from{opacity:.55}to{opacity:0}}

  /* --- result --------------------------------------------------------- */
  #finishCard{position:relative;border-radius:24px;padding:30px 30px 26px;min-width:min(78vw,300px);
    background:linear-gradient(180deg,rgba(18,23,29,.96),rgba(7,9,12,.97));
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 26px 70px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.14);
    animation:cardIn .5s cubic-bezier(.16,1,.3,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(34px) scale(.94)}to{opacity:1;transform:none}}
  /* the accent is the result: gold for a win, steel for anything else */
  #finishCard{--accent:#9aa4ae;--accent2:#5d666f}
  #finishCard.win{--accent:#ffd64a;--accent2:#c9932a}
  #finishCard::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;
    background:linear-gradient(160deg,var(--accent),transparent 42%,transparent 60%,var(--accent2));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;pointer-events:none}
  #finishCard .ribbon{display:inline-block;font-size:10px;letter-spacing:.34em;text-indent:.34em;
    padding:5px 12px;border-radius:999px;color:#05070a;background:var(--accent);
    font-weight:900;margin-bottom:12px}
  #finishCard h2{margin:0 0 4px;font-size:15px;letter-spacing:.14em;opacity:.62;font-weight:800}
  #finishCard .place{font-size:66px;font-weight:900;line-height:1;margin:6px 0 2px;
    letter-spacing:.06em;color:var(--accent);text-shadow:0 0 30px rgba(154,164,174,.22)}
  #finishCard.win .place{text-shadow:0 0 40px rgba(255,214,74,.5)}
  #finishCard .rtWrap{display:flex;flex-direction:column;gap:3px;margin:12px 0 20px}
  #finishCard .rtLabel{font-size:9px;letter-spacing:.34em;text-indent:.34em;opacity:.5;font-weight:800}
  #finishCard .rt{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  #finishCard button{pointer-events:auto;width:100%;height:54px;border-radius:16px;
    border:1px solid rgba(255,255,255,.2);color:#fff;font-size:15px;font-weight:900;
    letter-spacing:.1em;
    background:radial-gradient(130% 100% at 50% -20%,rgba(255,255,255,.24),rgba(255,255,255,.04) 64%),
               rgba(24,30,38,.9);
    box-shadow:0 10px 24px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.26)}
  #finishCard button:active{transform:scale(.97);border-color:rgba(255,255,255,.7)}

  /* --- lap banner ------------------------------------------------------
     A checkpoint is a quiet white flash. The final lap is not: it sweeps
     in as a red bar with its own rule, and the lap counter stays lit for
     the rest of the race (see body.final-lap below) so it is impossible
     to lose track of which lap you are on. */
  #lapPopup{position:fixed;left:50%;top:25%;transform:translate(-50%,-50%);
    z-index:16;pointer-events:none;opacity:0;text-align:center;color:#fff;font-weight:900;
    padding:12px 30px;border-radius:14px;
    background:linear-gradient(90deg,rgba(8,11,15,0),rgba(8,11,15,.72) 18%,rgba(8,11,15,.72) 82%,rgba(8,11,15,0));
    text-shadow:0 3px 0 rgba(0,0,0,.7);
    transition:opacity .2s ease, transform .2s ease}
  #lapPopup.show{opacity:1}
  #lapPopup .rule{height:2px;margin:0 auto 9px;width:0;background:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.8);transition:width .34s cubic-bezier(.16,1,.3,1)}
  #lapPopup.show .rule{width:78%}
  #lapPopup .main{font-size:min(11vw,46px);line-height:1;letter-spacing:.02em;white-space:nowrap}
  #lapPopup .sub{margin-top:7px;font-size:min(3.2vw,13px);opacity:.9;letter-spacing:.3em;text-indent:.3em}
  #lapPopup{transform:translate(-50%,-50%) scale(.9)}
  #lapPopup.show{transform:translate(-50%,-50%) scale(1)}
  /* final lap: red, wider, and it arrives from the side */
  #lapPopup.final{transform:translate(-50%,-50%) translateX(-42px) scale(.96);
    background:linear-gradient(90deg,rgba(60,6,6,0),rgba(74,7,7,.86) 16%,rgba(74,7,7,.86) 84%,rgba(60,6,6,0))}
  #lapPopup.final.show{transform:translate(-50%,-50%) scale(1)}
  #lapPopup.final .rule{background:#ff4133;box-shadow:0 0 16px rgba(255,65,51,.95)}
  #lapPopup.final .main{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.7),0 0 26px rgba(255,65,51,.8)}
  #lapPopup.final .sub{color:#ff8b80;opacity:1}

  /* Held for the whole final lap, on the lap counter alone. A red frame
     around the screen was tried here and read as damage -- as though the
     race was going badly -- rather than as "last lap". */
  body.final-lap .hud #lap{color:#ffc24a;
    text-shadow:0 2px 5px rgba(0,0,0,.85),0 0 16px rgba(255,194,74,.85)}

  #zoomBtn{
    position:fixed;left:14px;top:124px;z-index:15;
    width:auto;min-width:82px;height:38px;padding:0 12px;
    border:1px solid rgba(255,255,255,.34);border-radius:12px;
    background:rgba(8,10,16,.58);backdrop-filter:blur(6px);
    color:#fff;font-size:12px;font-weight:900;letter-spacing:.05em;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  #zoomBtn:active{transform:scale(.96);background:rgba(255,255,255,.18)}

  #stagePick{
    position:fixed;left:14px;top:170px;z-index:15;
    width:auto;min-width:82px;height:38px;padding:0 12px;
    border:1px solid rgba(255,255,255,.34);border-radius:12px;
    background:rgba(8,10,16,.58);backdrop-filter:blur(6px);
    color:#fff;font-size:12px;font-weight:900;letter-spacing:.05em;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  #stagePick:active{transform:scale(.96);background:rgba(255,255,255,.18)}

  #stageOverlay{z-index:40}
  #stageList{
    width:min(420px,88vw);max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch;
    background:rgba(10,12,18,.94);border:1px solid rgba(255,255,255,.16);
    border-radius:18px;padding:16px;pointer-events:auto;
  }
  #stageList h3{margin:0 0 12px;font-size:13px;letter-spacing:.2em;opacity:.65;font-weight:900}
  #stageList .row{
    display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 13px;
    border:1px solid rgba(255,255,255,.14);border-radius:13px;
    background:rgba(255,255,255,.05);color:#fff;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  #stageList .row:active{background:rgba(255,255,255,.18)}
  #stageList .row.current{border-color:#59b6ff;background:rgba(89,182,255,.16)}
  #stageList .row .n{font-size:15px;font-weight:900;letter-spacing:.06em}
  #stageList .row .c{font-size:11px;opacity:.72;margin-top:3px;letter-spacing:.06em}
  #stageList .row .r{font-size:11px;opacity:.85;margin-top:3px}
  #stageList .close{
    display:block;width:100%;margin-top:6px;height:42px;border-radius:13px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);
    color:#fff;font-weight:900;letter-spacing:.1em;
  }

</style>
</head>
<body class="pre-race">
<div id="app"></div>

<div class="hud">
  <div class="top">
    <div><div id="lap">LAP 1/3</div><div id="pos">POS 2/2</div></div>
    <div id="time">00:00.000</div>
  </div>
  <div class="note" id="note">v2.0 · PIXI RENDER CORE</div>
  <div class="speed"><span id="speed">0</span><small>km/h</small></div>
  <div class="nitroWrap" id="nitroWrap">
    <div class="nitroCells" id="nitroCells">
      <div class="nitroCell"><i></i></div>
      <div class="nitroCell"><i></i></div>
      <div class="nitroCell"><i></i></div>
    </div>
    <div class="nitroBurst"><i id="nitroBurst"></i></div>
    <div class="nitroLabel" id="nitroLabel">NITRO</div>
  </div>
</div>

<div class="controls">
  <div class="side"><button id="left">◀</button><button id="right">▶</button></div>
  <div class="side"><button id="brake">BRAKE</button><button id="nitro">NITRO<span class="cnt" id="nitroCnt">×0</span></button></div>
</div>
<button id="zoomBtn" aria-label="camera zoom">VIEW 1/3</button>
<button id="stagePick" aria-label="choose stage">STAGE 1/5</button>

<div class="overlay" id="stageOverlay" hidden>
  <div id="stageList">
    <h3>SELECT STAGE</h3>
    <div id="stageRows"></div>
    <button class="close" id="stageClose">CLOSE</button>
  </div>
</div>

<div id="loading">LOADING…</div>

<div class="overlay" id="vsOverlay" hidden>
  <div id="vsCard">
    <div class="stage" id="vsStage">STAGE 1</div>
    <div class="rival" id="vsRival">悪魔のアイツ</div>
    <div class="vs">VS</div>
  </div>
</div>

<div class="overlay" id="signalOverlay" hidden>
  <div id="startSignal">
    <div class="gantry">
      <div class="lamp" id="sig1"></div>
      <div class="lamp" id="sig2"></div>
      <div class="lamp" id="sig3"></div>
      <div class="lamp" id="sig4"></div>
      <div class="lamp" id="sig5"></div>
    </div>
    <div class="count" id="startCount"><span id="startCountText">3</span></div>
    <div class="cue" id="startCue">GET READY</div>
  </div>
</div>

<div id="lapPopup">
  <div class="rule"></div>
  <div id="lapPopupMain" class="main">LAP 2/3</div>
  <div id="lapPopupSub" class="sub">CHECKPOINT</div>
</div>

<div class="overlay" id="finishOverlay" hidden>
  <div id="finishCard">
    <div class="ribbon" id="finishRibbon">FINISHED</div>
    <h2 id="finishStage">STAGE 1 CLEAR</h2>
    <div class="place" id="finishPlace">WIN</div>
    <div class="rtWrap"><span class="rtLabel">RACE TIME</span><span class="rt" id="finishTime">00:00.000</span></div>
    <button id="retryBtn">NEXT STAGE</button>
  </div>
</div>

<script type="module">
(async()=>{
  const loading=document.getElementById('loading');
  try {
    const {boot}=await import('./src/main.js');
    const {NITRO,PHYSICS}=await import('./src/config.js');
    const el=(id)=>document.getElementById(id);
    const {game,app,stages}=await boot({stageId:1});
    loading.classList.add('hide');
    // Five stages exist. The progression was capped at 3, so stages 4 and 5
    // were unreachable by playing -- and there was no way to pick a stage at
    // all, which is also why the boot call sat on whichever stage was last
    // being worked on.
    const STAGE_IDS=Object.keys(stages).map(Number).sort((a,b)=>a-b);
    const LAST_STAGE=STAGE_IDS[STAGE_IDS.length-1];
    const zoomBtn=el('zoomBtn');
    const zoomNames=['VIEW 1/3','VIEW 2/3','VIEW 3/3'];
    zoomBtn.textContent=zoomNames[game.zoomLevel||0];
    zoomBtn.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const level=game.cycleZoom();
      zoomBtn.textContent=zoomNames[level];
    });
    const bind=(id,key)=>{const b=el(id);const on=e=>{e.preventDefault();game.input[key]=true;b.classList.add('pressed');try{b.setPointerCapture(e.pointerId)}catch{}};const off=e=>{e.preventDefault();game.input[key]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)};
    bind('left','left');bind('right','right');bind('brake','brake');
    const nitroControl=el('nitro');
    nitroControl.addEventListener('pointerdown',e=>{e.preventDefault();nitroControl.classList.add('pressed');game.player.tryNitro();try{nitroControl.setPointerCapture(e.pointerId)}catch{}});
    const releaseNitro=e=>{nitroControl.classList.remove('pressed')};
    nitroControl.addEventListener('pointerup',releaseNitro);nitroControl.addEventListener('pointercancel',releaseNitro);nitroControl.addEventListener('lostpointercapture',releaseNitro);
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')game.input.left=true;if(e.key==='ArrowRight'||e.key==='d')game.input.right=true;if(e.key==='ArrowDown'||e.key==='s')game.input.brake=true;if(e.key===' ')game.player.tryNitro()});
    addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')game.input.left=false;if(e.key==='ArrowRight'||e.key==='d')game.input.right=false;if(e.key==='ArrowDown'||e.key==='s')game.input.brake=false});
    const speedEl=el('speed'),nitroBtn=el('nitro'),nitroCnt=el('nitroCnt'),nitroWrap=el('nitroWrap'),
      nitroBurstEl=el('nitroBurst'),nitroLabel=el('nitroLabel'),
      nitroCells=Array.from(el('nitroCells').children).map(c=>({box:c,fill:c.firstElementChild})),
      lapEl=el('lap'),posEl=el('pos'),timeEl=el('time');
    // One cell per banked charge: filled cells are charges in hand, the cell
    // after them is the meter working toward the next. The label doubles as
    // the chain cue -- CHAIN READY is up exactly while a press would extend
    // the running burst instead of being refused, so the player can see the
    // window rather than having to guess at it.
    const paintNitro=(p)=>{
      const stock=p.nitroStock,part=p.nitroCharge/100;
      for(let i=0;i<nitroCells.length;i++){
        const v=i<stock?1:(i===stock?part:0);
        nitroCells[i].fill.style.transform=`scaleX(${v})`;
        nitroCells[i].box.classList.toggle('full',i<stock);
      }
      nitroWrap.classList.toggle('firing',p.boosting);
      nitroBurstEl.style.transform=`scaleX(${p.boosting?Math.min(1,p.boostTimer/PHYSICS.boostDuration):0})`;
      nitroCnt.textContent='×'+stock;
      const canFire=stock>0&&(!p.boosting||p.boostTimer<=NITRO.chainWindow);
      nitroBtn.classList.toggle('ready',canFire);
      nitroLabel.textContent=p.boosting?(canFire?'NITRO · CHAIN READY':'NITRO · FIRING'):'NITRO';
    };
    const vsOverlay=el('vsOverlay'),vsStage=el('vsStage'),vsRival=el('vsRival'),signalOverlay=el('signalOverlay');
    const startLamps=[el('sig1'),el('sig2'),el('sig3'),el('sig4'),el('sig5')];
    const startCount=el('startCount'),startCountText=el('startCountText'),startCue=el('startCue');
    const finishOverlay=el('finishOverlay'),finishStage=el('finishStage'),finishPlace=el('finishPlace'),finishTime=el('finishTime'),finishCard=el('finishCard'),finishRibbon=el('finishRibbon'),lapPopup=el('lapPopup'),lapPopupMain=el('lapPopupMain'),lapPopupSub=el('lapPopupSub'),stageBtn=el('retryBtn');

    // --- start lights ---
    // The five lamps fill evenly across the countdown and all turn green
    // together on zero, which is the moment the numeral becomes GO and the
    // screen blinks. `shownCount` exists so the numeral's punch
    // animation is retriggered once per change rather than every frame.
    const COUNTDOWN=3.2, GO_AT=0.55, PADS_UP_AT=1.35;
    let shownCount=null;
    const paintStart=(t)=>{
      const go=t<=GO_AT;
      const lit=go?5:Math.min(5,Math.floor((COUNTDOWN-t)/((COUNTDOWN-GO_AT)/5))+1);
      for(let i=0;i<startLamps.length;i++){
        startLamps[i].className='lamp'+(go?' go':(i<lit?' on':''));
      }
      const label=go?'GO!':String(Math.min(3,Math.ceil((t-GO_AT)/((COUNTDOWN-GO_AT)/3))));
      if(label!==shownCount){
        shownCount=label;
        startCountText.textContent=label;
        startCount.classList.remove('punch');
        void startCount.offsetWidth;
        startCount.classList.add('punch');
      }
      startCount.classList.toggle('go',go);
      signalOverlay.classList.toggle('go',go);
      startCue.textContent=go?'':'GET READY';
    };
    const resetStart=()=>{
      shownCount=null;
      signalOverlay.classList.remove('go');
      startCount.classList.remove('go','punch');
    };
    const syncStageUI=()=>{
      vsStage.textContent=game.cfg.name;
      vsRival.textContent=game.cfg.rivalName;
      finishStage.textContent=`${game.cfg.name} CLEAR`;
      stageBtn.textContent=game.stageId<LAST_STAGE?'NEXT STAGE':'RETRY FINAL STAGE';
      lapEl.textContent=`LAP 1/${game.race?.totalLaps??3}`;
      posEl.textContent='POS 2/2';
      timeEl.textContent='00:00.000';
    };
    syncStageUI();
    const fmtTime=s=>{const ms=Math.max(0,Math.floor(s*1000)),m=Math.floor(ms/60000),sec=Math.floor((ms%60000)/1000),cs=ms%1000;return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(cs).padStart(3,'0')}`};
    let shownFinish=false,finishDelay=0,lapPopupTimer=0;
    // The final lap gets its own banner AND leaves the HUD flagged until
    // the race ends -- a banner that has already faded cannot answer "which
    // lap am I on" three corners later, which is what makes the last lap
    // easy to miss.
    const showLapPopup=(lap,total)=>{
      const final=lap===total;
      lapPopupMain.textContent=final?'FINAL LAP':`LAP ${lap}/${total}`;
      lapPopupSub.textContent=final?`LAP ${total} OF ${total}`:'CHECKPOINT';
      lapPopup.classList.remove('show');
      lapPopup.classList.toggle('final',final);
      void lapPopup.offsetWidth;
      lapPopup.classList.add('show');
      lapPopupTimer=final?2.2:1.45;
      if(final)document.body.classList.add('final-lap');
    };
    const clearBanners=()=>{
      lapPopup.classList.remove('show','final');
      document.body.classList.remove('final-lap');
      resetStart();
    };
    app.ticker.add(ticker=>{
      const dt=Math.min(.033,ticker.deltaMS/1000),p=game.player;
      speedEl.textContent=Math.max(0,Math.round(p.displaySpeed));
      paintNitro(p);
      if(lapPopupTimer>0){lapPopupTimer-=dt;if(lapPopupTimer<=0)lapPopup.classList.remove('show')}
      const race=game.race;
      if(!race)return;
      if(race.lapAnnounce!=null){showLapPopup(race.lapAnnounce,race.totalLaps);race.lapAnnounce=null}
      const lap=Math.min(game.playerEntry.progress.lap,race.totalLaps);
      lapEl.textContent=`LAP ${lap}/${race.totalLaps}`;
      posEl.textContent=`POS ${race.positionOf(game.playerEntry)}/2`;
      timeEl.textContent=fmtTime(race.time);
      vsOverlay.hidden=race.state!=='vs';
      signalOverlay.hidden=race.state!=='countdown';
      if(race.state==='countdown')paintStart(race.countdown);
      // Pads are away for the VS card and most of the countdown, and rise
      // with about a second to spare -- settled and pressable well before
      // the lights go green at 0.55.
      document.body.classList.toggle('pre-race',
        race.state==='vs'||(race.state==='countdown'&&race.countdown>PADS_UP_AT));
      if(race.state==='finished'&&!shownFinish){
        // The red frame is a "you are on the last lap" cue; once the line
        // is crossed it is answering a question nobody is asking, and it
        // fights the finish effect for the same edges.
        document.body.classList.remove('final-lap');
        finishDelay+=dt;
        // Held back until the finish effect (render/finishfx.js) has run
        // its banner and title and cleared out of the way.
        if(finishDelay>=1.9){
          shownFinish=true;
          const place=race.positionOf(game.playerEntry);
          const won=place===1;
          finishCard.classList.toggle('win',won);
          finishRibbon.textContent=won?'WINNER':'FINISHED';
          finishStage.textContent=won?`${game.cfg.name} CLEAR`:`${game.cfg.name} RESULT`;
          finishPlace.textContent=won?'WIN':'LOSE';
          finishTime.textContent=fmtTime(game.playerEntry.progress.finishTime??race.time);
          stageBtn.textContent=(won&&game.stageId<LAST_STAGE)?'NEXT STAGE':(won?'RETRY FINAL STAGE':'RETRY');
          finishOverlay.hidden=false;
        }
      }
    });
    // --- stage picker ---
    const stagePick=el('stagePick'),stageOverlay=el('stageOverlay'),stageRows=el('stageRows'),stageClose=el('stageClose');
    const syncPickLabel=()=>{stagePick.textContent=`STAGE ${game.stageId}/${LAST_STAGE}`};
    const buildRows=()=>{
      stageRows.textContent='';
      for(const id of STAGE_IDS){
        const cfg=stages[id];
        const b=document.createElement('button');
        b.className='row'+(id===game.stageId?' current':'');
        b.innerHTML=`<div class="n">${cfg.name} · ${cfg.shortDesc}</div>`
          +`<div class="c">${cfg.courseName} — ${cfg.courseDesc}</div>`
          +`<div class="r">RIVAL: ${cfg.rivalName}</div>`;
        b.addEventListener('pointerdown',ev=>{
          ev.preventDefault();
          stageOverlay.hidden=true;
          shownFinish=false;finishDelay=0;lapPopupTimer=0;
          clearBanners();
          finishOverlay.hidden=true;
          game.loadStage(id);
          syncStageUI();
          syncPickLabel();
        });
        stageRows.appendChild(b);
      }
    };
    stagePick.addEventListener('pointerdown',e=>{e.preventDefault();buildRows();stageOverlay.hidden=false});
    stageClose.addEventListener('pointerdown',e=>{e.preventDefault();stageOverlay.hidden=true});
    syncPickLabel();

    stageBtn.addEventListener('pointerdown',e=>{
      e.preventDefault();
      shownFinish=false;
      finishDelay=0;
      lapPopupTimer=0;
      clearBanners();
      finishOverlay.hidden=true;
      const place=game.race?.positionOf(game.playerEntry)??2;
      const nextStage=(place===1&&game.stageId<LAST_STAGE)?game.stageId+1:game.stageId;
      game.loadStage(nextStage);
      syncStageUI();
      syncPickLabel();
    });
    window.__game=game;window.__app=app;
  } catch(err) {
    loading.textContent='ERROR: '+(err?.message||err);console.error(err);
  }
})();
</script>
</body>
</html>
